services:
  postgres:
    image: postgres:15-alpine
    container_name: flowai-postgres
    environment:
      POSTGRES_DB: flowai
      POSTGRES_USER: flowai
      POSTGRES_PASSWORD: flowai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flowai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Forced to the in-network Compose service names, same reasoning as
      # the other env_file values: a native (non-Docker) DATABASE_URL/
      # REDIS_URL in backend/.env would otherwise point at localhost,
      # which doesn't resolve to the postgres/redis containers from here.
      DATABASE_URL: postgresql://flowai:flowai_dev_password@postgres:5432/flowai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: flowai-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
